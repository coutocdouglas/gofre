# Cria o instalador do Windows sozinho e publica na aba "Releases".
# Para lançar uma versão nova: git tag v2.6.0 && git push --tags   (ou use o botão "Run workflow")
name: Publicar versão
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-desktop.txt pyinstaller
      - run: python -m PyInstaller --noconfirm --clean financeiro.spec
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Gerar instalador
        shell: cmd
        run: '"%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" instalador.iss'
      - name: Publicar
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: instalador/Instalar_Financeiro_*.exe
          generate_release_notes: true
      - name: Guardar instalador (execução manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: instalador
          path: instalador/Instalar_Financeiro_*.exe
